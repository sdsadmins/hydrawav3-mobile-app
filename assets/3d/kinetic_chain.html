<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #ffffff;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #err {
        display: none;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #475569;
        font: 600 14px system-ui, -apple-system, sans-serif;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="err"></div>
    <script type="module" src="viewer.bundle.js"></script>
  </body>
</html>
