<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Pad placement</title>
<style>
  html, body { margin: 0; height: 100%; width: 100%; overflow: hidden; background: #0A192F; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #err, #load { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
    color: #8892B0; font: 600 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; pointer-events: none; }
  #err { display: none; color: #EF4444; }
  #load .spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #233554; border-top-color: #CD7F32; animation: s 0.9s linear infinite; margin: 0 auto 12px; }
  @keyframes s { to { transform: rotate(360deg); } }
  #palette { position: absolute; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); display: flex; gap: 14px; padding: 8px 12px;
    background: rgba(17, 34, 64, 0.92); border: 1px solid #233554; border-radius: 999px; box-shadow: 0 8px 24px rgba(0,0,0,.35); opacity: 0; transition: opacity .3s, transform .3s; touch-action: none; }
  #palette.on { opacity: 1; transform: translateX(-50%); }
  .pad { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none;
    background: #0A192F; border: 2px solid currentColor; box-shadow: 0 0 0 0 currentColor; transition: transform .15s, box-shadow .15s; }
  .pad svg { width: 30px; height: 30px; pointer-events: none; }
  .pad.sun { color: #FBBF24; } .pad.moon { color: #818CF8; }
  .pad:active, .pad.grab { transform: scale(1.08); box-shadow: 0 0 0 5px rgba(255,255,255,.08); }
  .pad.ghost { position: fixed; left: 0; top: 0; transform: translate(-50%, -50%) scale(1.15); pointer-events: none; z-index: 10; opacity: .95; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(98px + env(safe-area-inset-bottom)); color: #8892B0; font: 500 12px system-ui, sans-serif; pointer-events: none; white-space: nowrap; opacity: .9; }
  #del { position: fixed; display: none; width: 34px; height: 34px; border-radius: 50%; background: #EF4444; color: #fff; border: 2px solid #0A192F; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,.4); z-index: 5; cursor: pointer; transform: translate(-50%, -50%); touch-action: none; padding: 0; }
  #del svg { width: 18px; height: 18px; pointer-events: none; }
  body.readonly .hint { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="load"><div><div class="spin"></div>Loading anatomy…</div></div>
<div id="err"></div>
<button id="del" aria-label="Remove pad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
<div id="palette">
  <div class="pad sun" data-type="sun" aria-label="Sun pad">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </div>
  <div class="pad moon" data-type="moon" aria-label="Moon pad">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </div>
</div>
<div class="hint">Drag a pad onto the body · drag to rotate · pinch to zoom</div>
<script src="coach_viewer.bundle.js"></script>
<script>
/* app: the viewer draws only on change — any API call (markers, views,
   background) or a resize marks a few frames to redraw. */
(function () {
  window.__hwDirty = 10;
  var api = window.__anatomyApi;
  if (api) Object.keys(api).forEach(function (k) {
    var f = api[k];
    if (typeof f !== 'function') return;
    var w = function () { window.__hwDirty = 12; return f.apply(this, arguments); };
    api[k] = w; window[k] = w;
  });
  window.addEventListener('resize', function () { window.__hwDirty = 12; });
})();
</script>
</body>
</html>
